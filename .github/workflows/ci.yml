name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (Node + Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm --prefix backend ci
      - name: Lint
        run: npm --prefix backend run lint
      - name: Test + coverage
        run: npm --prefix backend run test:coverage
        env:
          NODE_ENV: test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  frontend-web:
    name: Frontend Web (Vite + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Install
        run: npm --prefix frontend-web ci
      - name: Test + coverage
        run: npm --prefix frontend-web run test:coverage
      - name: Build production bundle
        run: npm --prefix frontend-web run build
        env:
          VITE_API_URL: /api
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend-web/coverage/
          retention-days: 7

  optimizer-service:
    name: Optimizer (Python + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: optimizer-service/requirements.txt
      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Test + coverage
        run: pytest tests/ --cov=hgs --cov=app --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-coverage
          path: optimizer-service/coverage.xml
          retention-days: 7
