server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50M;

  # SPA fallback: mọi route React đều trả về index.html
  location / {
    try_files $uri /index.html;
  }

  # REST API
  location /api/ {
    proxy_pass http://backend:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AI Agent streaming (NDJSON chunked) — phải tắt buffer để event tới client realtime
  location = /api/agent/stream {
    proxy_pass http://backend:5000/api/agent/stream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 120s;
    chunked_transfer_encoding on;
  }

  # Socket.IO — bắt buộc upgrade WebSocket cho GPS realtime + chat driver
  location /socket.io/ {
    proxy_pass http://backend:5000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 86400s;
  }

  # Swagger UI + OpenAPI spec
  location /api-docs {
    proxy_pass http://backend:5000/api-docs;
    proxy_set_header Host $host;
  }
  location = /api-docs.json {
    proxy_pass http://backend:5000/api-docs.json;
    proxy_set_header Host $host;
  }

  # Health check
  location = /health {
    proxy_pass http://backend:5000/health;
  }
}
