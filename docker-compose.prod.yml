# Production compose — chỉ dùng trên server (EC2 / VPS).
# Khác với docker-compose.yml (dev):
#   - Backend đọc biến môi trường từ backend/.env.production (KHÔNG hardcode trong compose)
#   - Mọi port nội bộ chỉ bind 127.0.0.1 → ép traffic public phải đi qua Nginx + HTTPS
#   - mongo-express bị loại bỏ (UI debug DB không nên expose ngoài prod)
#   - Image tag :prod để phân biệt với image dev
#
# Chạy: make start-prod   (hoặc: docker compose -f docker-compose.prod.yml up -d --build)

services:
  mongo:
    image: mongo:7
    container_name: tms-mongo
    restart: unless-stopped
    # KHÔNG expose port ra ngoài host — chỉ container nội bộ mạng compose dùng được
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: road_freight

  optimizer:
    build:
      context: ./optimizer-service
    image: road-freight-tms-optimizer:prod
    container_name: tms-optimizer
    restart: unless-stopped
    # Chỉ bind loopback, Nginx (host) sẽ proxy nếu cần
    ports:
      - "127.0.0.1:8000:8000"

  # Redis cache: tăng throughput 4-5× cho endpoint đọc nhiều + share state cho rate-limit khi scale ngang
  redis:
    image: redis:7-alpine
    container_name: tms-redis
    restart: unless-stopped
    # Không persistence: cache mất khi restart không nghiêm trọng (sẽ tự rebuild từ DB)
    # 256MB max + LRU eviction → dùng RAM có kiểm soát, không bao giờ OOM
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
    image: road-freight-tms-backend:prod
    container_name: tms-backend
    restart: unless-stopped
    depends_on:
      - mongo
      - optimizer
      - redis
    env_file:
      - ./backend/.env.production
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend-web:
    build:
      context: ./frontend-web
      args:
        # Frontend gọi /api/* (relative) → nginx trong container proxy về backend.
        # KHÔNG hardcode IP/domain vào build → image dùng được trên mọi server.
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: road-freight-tms-web:prod
    container_name: tms-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Bind 0.0.0.0:8080 → user truy cập http://<EC2-IP>:8080
      # Nginx container đã proxy /api/* + /socket.io/* → backend (port 5000 không cần expose)
      - "0.0.0.0:8080:80"

  docs:
    build:
      context: ./docs-site
      args:
        # Self-host root → baseUrl="/" (override GitHub Pages default trong docusaurus.config.js)
        DOCS_URL: ${DOCS_URL:-http://localhost:8081}
        DOCS_BASE_URL: ${DOCS_BASE_URL:-/}
    image: road-freight-tms-docs:prod
    container_name: tms-docs
    restart: unless-stopped
    ports:
      # User docs ở port riêng → không xung đột route React Router của web app
      - "0.0.0.0:8081:80"

volumes:
  mongo-data:
    name: tms-mongo-data
