server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip cho asset text
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;

  # Asset có hash → cache vĩnh viễn
  location ~* \.(js|css|woff2?|ttf|otf|eot|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Docusaurus tạo HTML tĩnh per-route → không cần SPA fallback nặng
  # Nhưng vẫn fallback về 404.html của Docusaurus cho URL sai
  location / {
    try_files $uri $uri/ $uri.html /404.html;
  }
}
